<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosaha — Galerie</title>
    <link rel="icon" href="Icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      /* base font-size: adjust to scale the whole UI */
      :root{--ui-size:0.9375rem; --headline-size:2rem; --accent:#C34E4E; --select-width:11rem; --control-height:2.25rem}
      html{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
      html,body{height:100%;margin:0;background:#ffffff;touch-action:pan-y}
      .wrap{max-width:75rem;margin:2.25rem auto;padding:1.125rem}
      .logo-bar{display:flex;align-items:center;justify-content:center;margin:0 0 1.5rem}
      .logo{height:6.25rem;width:auto;display:block}
      h1{font-weight:600;margin:0 0 0.5rem;font-size:var(--headline-size)}
      p.phi{margin:0 0 1rem 0;color:#6b6a66;max-width:none;width:100%;font-size:var(--ui-size)}
      .controls{display:flex;flex-direction:column;gap:0.625rem;margin:0.625rem 0 1.25rem}
      .control-group{display:flex;flex-direction:column;align-items:flex-start;gap:0.25rem}
      .controls label{font-size:var(--ui-size);color:#595853}
      .controls select{appearance:none;padding:0 0.75rem;border:0.0625rem solid #e7e3dc;border-radius:0;background:#fff;font-size:var(--ui-size);height:var(--control-height);display:inline-flex;align-items:center}
      .controls select:focus, .controls select:active, .controls select:focus-visible{
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(195,78,78,0.12);
      }
      /* also use accent on hover */
      .controls select:hover{
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(195,78,78,0.06);
      }
      /* custom select fallback styles (we will construct a custom control in JS) */
      .custom-select{position:relative;display:inline-block}
      .custom-select-button{background:#fff;border:0.0625rem solid #e7e3dc;border-radius:0;padding:0 0.75rem;font-size:var(--ui-size);display:inline-flex;align-items:center;gap:0.5rem;cursor:pointer;min-width:var(--select-width);max-width:var(--select-width);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:var(--control-height);}
      .custom-select-button:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(195,78,78,0.12)}
      .custom-select-list{position:absolute;right:0;left:0;margin-top:0.25rem;background:#fff;border:0.0625rem solid #e7e3dc;z-index:80;max-height:20rem;overflow:auto}
      .custom-select-item{padding:0.5rem 0.75rem;font-size:var(--ui-size);cursor:pointer}
      .custom-select-item:hover{background:var(--accent);color:#fff}
      /* attempt to tint option hover where supported */
      .controls select option:hover{ background: rgba(195,78,78,0.06); }
      /* MS expand arrow color tweak */
      .controls select::-ms-expand{ color:var(--accent); }
      /* grid: maximum 4 columns, responsive down to 1 */
      .top-row{display:grid;grid-template-columns:repeat(4,minmax(12.5rem,1fr));gap:0.875rem;margin-bottom:0.875rem}
      .bottom-row{display:grid;grid-template-columns:repeat(4,minmax(12.5rem,1fr));gap:0.875rem;margin-top:1.25rem}
      .selected-row{display:grid;grid-template-columns:repeat(4,minmax(12.5rem,1fr));gap:0.875rem;margin-top:1.25rem}
      .mail-send-btn{font-size:var(--ui-size);padding:0 0.75rem;border:0;border-radius:0;background:var(--accent);color:#fff;cursor:pointer;height:var(--control-height);line-height:var(--control-height)}
      .mail-send-btn:hover{background:#a93b3b}
      .grid{display:grid;grid-template-columns:repeat(4,minmax(12.5rem,1fr));gap:0.875rem}
      @media (max-width:64rem){
        .grid,.top-row,.bottom-row,.selected-row{grid-template-columns:repeat(3,minmax(12.5rem,1fr));}
      }
      @media (max-width:48rem){
        .grid,.selected-row{grid-template-columns:repeat(2,minmax(12.5rem,1fr));}
        /* top-row/bottom-row are fixed UI tiles, not artwork thumbnails —
           they should always be single-column in mobile view (where the
           zoom control appears), regardless of the artwork grid's zoom
           level, matching the same intent as the force-cols-* rules below */
        .top-row,.bottom-row{grid-template-columns:repeat(1,minmax(12.5rem,1fr));}
      }
      @media (max-width:32.5rem){
        .grid,.selected-row{grid-template-columns:repeat(1,minmax(12.5rem,1fr));}
      }
      /* manual "zoom" override (mobile only) — lets a visitor see more,
         smaller columns than the automatic breakpoint would give them.
         No minmax floor here on purpose: the whole point is fitting more
         columns into a narrow screen than 12.5rem/column would allow.
         top-row/bottom-row are fixed UI tiles (intro, contact), not
         artwork thumbnails, so they're deliberately excluded — only the
         artwork grid and the liked-artworks row respond to zoom */
      body.force-cols-2 .grid,body.force-cols-2 .selected-row{grid-template-columns:repeat(2,1fr)!important}
      body.force-cols-4 .grid,body.force-cols-4 .selected-row{grid-template-columns:repeat(4,1fr)!important}
      body.force-cols-4 .grid .text-item{display:none}
      .mobile-top-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:95;background:#fff;border-bottom:0.0625rem solid #e7e3dc;align-items:center;justify-content:space-between;padding:0.5rem 0.75rem}
      @media (max-width:48rem){
        .mobile-top-bar{display:flex}
      }
      .mobile-top-logo-btn{background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;align-items:center}
      .mobile-top-logo-img{height:2rem;width:auto;display:block}
      .zoom-switch{display:flex;border:0.0625rem solid #e7e3dc}
      .zoom-btn{background:#fff;border:0;padding:0 0.6rem;height:var(--control-height);font-size:var(--ui-size);cursor:pointer;color:#595853;font-family:inherit}
      .zoom-btn.active{background:var(--accent);color:#fff}
      /* match artwork cell appearance and force square aspect */
      .logo-item, .headline-item, .text-item{
        background:#fff;
        border:0.0625rem solid #efece6;
        border-radius:0; /* square corners */
        overflow:hidden;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:0.5rem;
        aspect-ratio:1/1;
      }
      /* logo should fill the whole cell */
      .logo-item{padding:0;border:0}
      .logo-icon{width:100%;height:100%;object-fit:cover;display:block}
      .headline-item h1{margin:0;font-size:var(--headline-size);text-align:left}
      .headline-item{flex-direction:column;align-items:flex-start;justify-content:space-between;padding-left:0.75rem;border:0}
      .headline-item .phi{margin:0;font-size:var(--ui-size);text-align:left}
      .text-item{border:0;display:flex;align-items:flex-end;padding-left:0.75rem;padding-right:0.75rem}
      .text-item .phi{margin:0;font-size:var(--ui-size);padding:0 0.5rem}
      .text-item .title{display:block}
      .text-item .meta{display:block;color:#6b6a66}
      /* text position variants when text appears left or right of artwork */
      .text-item.side-right{justify-content:flex-start;padding-left:0.75rem;padding-right:0.5rem}
      .text-item.side-right .phi{text-align:left}
      .text-item.side-left{justify-content:flex-end;padding-right:0.75rem;padding-left:0.5rem}
      .text-item.side-left .phi{text-align:right}
      /* single-column view: always below the artwork, top-left aligned,
         instead of the alternating side-left/side-right layout */
      .text-item.single-col{align-items:flex-start;justify-content:flex-start;padding-left:0.75rem;padding-right:0.75rem}
      .text-item.single-col .phi{text-align:left}
      .text-item .title{font-weight:600;margin-bottom:0.25rem;font-size:var(--ui-size)}
      .text-item .meta{font-size:var(--ui-size);color:#6b6a66}
      /* single philosophy cell (one tile) */
      .philosophy-item{background:#fff;border:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start;padding:0.75rem;aspect-ratio:1/1}
      .philosophy-item .phi{font-size:var(--ui-size);text-align:left;margin:0}
      /* controls inside a tile */
      .controls-item{position:relative;background:#fff;border:0;display:flex;align-items:center;justify-content:center;padding:0.5rem;aspect-ratio:1/1;overflow:auto}
      .controls-item .controls{width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0.625rem;padding-left:0.5rem}
      .lang-switch{position:absolute;top:0.5rem;right:0.5rem;display:flex;border:0.0625rem solid #e7e3dc;overflow:hidden}
      .lang-btn{background:#fff;border:0;padding:0 0.75rem;font-size:var(--ui-size);height:var(--control-height);cursor:pointer;color:#595853;font-family:inherit}
      .lang-btn.active{background:var(--accent);color:#fff}
      .lang-btn:hover:not(.active){background:#f5f2ec}
      .filter-switch{display:flex;flex-wrap:wrap;gap:0.375rem}
      .filter-btn{background:#fff;border:0.0625rem solid #e7e3dc;padding:0 0.6rem;height:var(--control-height);font-size:var(--ui-size);cursor:pointer;color:#595853;font-family:inherit}
      .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
      .filter-btn:hover:not(.active){background:#f5f2ec}
      /* bottom-row cells share the same look as other tiles */
      .bottom-row .cell-like{background:#fff;border:0;border-radius:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0.75rem;aspect-ratio:1/1}
      .cell{position:relative;background:#fff;border:0.0625rem solid #efece6;border-radius:0;overflow:hidden;display:block}
      .cell img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:block}
      .cell img,.modal img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;user-select:none}
      .select-btn{position:absolute;top:0.5rem;right:0.5rem;width:1.875rem;height:1.875rem;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;line-height:1;color:var(--accent);box-shadow:0 0.0625rem 0.25rem rgba(0,0,0,0.15)}
      .select-btn.selected{background:var(--accent);color:#fff}
      .select-btn:hover{box-shadow:0 0 0 4px rgba(195,78,78,0.12)}
      /* single-column inline prev/next — replaces opening the lightbox,
         since the thumbnail is already nearly full width there */
      .cell-nav{position:absolute;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#fff;font-size:1.125rem;line-height:1;padding:0.625rem 0.5rem;cursor:pointer;z-index:5}
      .cell-nav-prev{left:0}
      .cell-nav-next{right:0}
      /* padding-bottom fallback (matches #bottom-spacer's fallback) —
         reserves room so the enlarged image never sits under the always-
         on-top selection bar; kept in sync with the bar's real height by
         renderSelectionBar() */
      .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,8,8,0.6);z-index:60;box-sizing:border-box;padding-bottom:4rem}
      .modal.open{display:flex}
      .modal-nav{position:fixed;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#fff;font-size:1.5rem;padding:0.5rem;cursor:pointer;z-index:70}
      #modal-prev{left:1rem}
      #modal-next{right:1rem}
      .modal img{max-width:92vw;max-height:88vh;box-shadow:0 1.875rem 5rem rgba(0,0,0,0.5);border-radius:0}
      /* bottom offset includes the (JS-set) selection bar height, so the
         caption doesn't render underneath the always-on-top bar */
      .caption{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.5rem + var(--selection-bar-height, 4rem));color:#fff;font-size:0.875rem}
      /* always above .modal (60) so it stays visible while viewing an
         artwork; the modal reserves matching bottom space (set in
         renderSelectionBar()) so the enlarged image never sits under it */
      .selection-bar{position:fixed;left:0;right:0;bottom:0;z-index:95;background:#fff;border-top:0.0625rem solid #e7e3dc;box-shadow:0 -0.125rem 0.5rem rgba(0,0,0,0.08)}
      .selection-bar-inner{max-width:75rem;margin:0 auto;padding:0.5rem 1.125rem;display:flex;align-items:center;gap:0.75rem;font-size:var(--ui-size)}
      .selection-bar-label{font-weight:600;white-space:nowrap;flex-shrink:0}
      .selection-bar-names{flex:1;overflow-x:auto;white-space:nowrap;color:#6b6a66;font-size:var(--ui-size)}
      .selection-bar-inner .mail-send-btn{flex-shrink:0;white-space:nowrap}
      /* real block-level spacer reserving room for the fixed selection bar
         at the end of .wrap's content — more robust than body padding-bottom,
         which depends on how html,body{height:100%} interacts with overflow.
         4rem is a fallback for the instant before JS measures the bar's
         actual height in renderSelectionBar() */
      #bottom-spacer{height:4rem}
      #request-availability-btn .label-short{display:none}
      @media (max-width:32.5rem){
        h1{font-size:1.375rem}
        .logo{height:4.5rem}
        /* full label ("Request Availability"/"Verfügbarkeit anfragen")
           overflows the bar on narrow screens — swap to the short one */
        #request-availability-btn .label-full{display:none}
        #request-availability-btn .label-short{display:inline}
      }
    </style>
  </head>
  <body>
    <div id="mobile-top-bar" class="mobile-top-bar">
      <button type="button" id="scroll-top-btn" class="mobile-top-logo-btn" aria-label="Scroll to top">
        <img src="Icon.svg" alt="Cosaha" class="mobile-top-logo-img">
      </button>
      <div class="zoom-switch" id="zoom-switch">
        <button type="button" class="zoom-btn" data-cols="1">1</button>
        <button type="button" class="zoom-btn" data-cols="2">2</button>
        <button type="button" class="zoom-btn" data-cols="4">4</button>
      </div>
    </div>
    <div class="wrap">
      <div class="controls">
        <div class="control-group">
          <label for="sort-select">Sort by:</label>
          <select id="sort-select">
            <option value="newest">Newest</option>
            <option value="color">Color</option>
            <option value="title">Title</option>
          </select>
        </div>
        <div class="control-group">
          <label id="filter-label">Category:</label>
          <div class="filter-switch" id="filter-switch">
            <button type="button" class="filter-btn" data-filter="spring">Spring</button>
            <button type="button" class="filter-btn" data-filter="summer">Summer</button>
            <button type="button" class="filter-btn" data-filter="autumn">Autumn</button>
            <button type="button" class="filter-btn" data-filter="winter">Winter</button>
            <button type="button" class="filter-btn" data-filter="christmas">Christmas</button>
          </div>
        </div>
        <div class="lang-switch" id="lang-switch">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn active" data-lang="de">DE</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <div id="bottom-spacer"></div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-hidden="true">
      <div id="modal-content"></div>
      <button id="modal-prev" class="modal-nav" aria-label="Previous">◀</button>
      <button id="modal-next" class="modal-nav" aria-label="Next">▶</button>
    </div>
    <div id="cap" class="caption" aria-hidden="true"></div>

    <div id="selection-bar" class="selection-bar">
      <div class="selection-bar-inner">
        <span class="selection-bar-label"></span>
        <span class="selection-bar-names"></span>
        <button type="button" id="request-availability-btn" class="mail-send-btn"></button>
      </div>
    </div>

    <script>
      // artworkSources will be derived at runtime from folderImages.json
      // so the site updates automatically when that file is regenerated.
      let artworkSources = [];

      // --- i18n -----------------------------------------------------------
      // Artwork titles themselves (from filenames) stay untranslated — they're
      // proper names. The Impressum/Datenschutzerklärung text also stays
      // German-only in both languages (it's a German legal document; an
      // informal translation of legal text isn't something to auto-generate).
      let currentLang = 'de';
      const translations = {
        en: {
          title: 'Cosaha — Gallery',
          sortBy: 'Sort by:',
          sortNewest: 'Newest',

          sortTitle: 'Title',
          filterBy: 'Category:',

          filterSummer: 'Summer',
          filterAutumn: 'Autumn',
          filterWinter: 'Winter',
          filterChristmas: 'Christmas',
          headline: 'Bring color into your home.',
          introWelcome: 'Welcome to my page featuring colorful wall art in the form of handmade prints created with acrylic paint on paper, known as gel prints. They cannot be replicated, so each piece is one-of-a-kind.',
          introDetails: 'I love experimenting with colors, shapes, textures, and materials. To create my monoprints, I use natural materials like leaves and grasses, as well as all kinds of everyday objects—even empty packaging materials.\nThis wide range of materials is what makes the results so diverse and unique. The only constant is the Gelli Plate itself, with its square shape measuring 15 x 15 cm. Have fun browsing!',

          mailSubjectPrefix: 'Interest in artworks: ',

          colors: {red:'red',orange:'orange',yellow:'yellow',lime:'lime',green:'green',teal:'teal',cyan:'cyan',blue:'blue',indigo:'indigo',violet:'violet',magenta:'magenta',crimson:'crimson',unknown:'unknown'},
          collections: {'Weihnachten':'Christmas','Edition E':'Edition E','Variant':'Variant','General':'General'}
        },
        de: {
          title: 'Cosaha — Galerie',
          sortBy: 'Sortieren nach:',
          sortNewest: 'Neueste',
          sortColor: 'Farbe',
          sortTitle: 'Titel',
          filterBy: 'Kategorie:',
          filterSpring: 'Frühling',
          filterSummer: 'Sommer',
          filterAutumn: 'Herbst',
          filterWinter: 'Winter',
          filterChristmas: 'Weihnachten',
          headline: 'Bring Farbe in \ndein Zuhause.',
          introWelcome: 'Willkommen auf meiner Seite der farbenfrohen Wandkunst in Form von handgefertigten Drucken mit Acrylfarbe auf Papier, sogenannten Gelprints. Sie sind nicht wiederholbar und somit ist jedes Stück ein Unikat.',
          introDetails: 'Ich liebe es, mit Farben, Formen, Texturen und Materialien zu experimentieren. So verwende ich für die Gestaltung meiner Monoprints natürliche Materialien wie Blätter und Gräser, aber auch Alltagsgegenstände aller Art bis hin zu leeren Verpackungsmaterialien.\nDiese Bandbreite macht die Ergebnisse so vielfältig und individuell. Die einzige Konstante ist die Gelli Plate selbst mit ihrer quadratischen Form von 15 x 15 cm. Viel Spaß beim Stöbern!',
          reachOut: 'Melde dich!',
          selectionBarLabel: 'Ausgewählte Kunstwerke:',
          requestAvailability: 'Verfügbarkeit anfragen',
          requestAvailabilityShort: 'Anfrage',
          impressum: 'Impressum',
          prevAria: 'Zurück',
          nextAria: 'Weiter',
          markInterested: 'Als interessant markieren',

          mailGreeting: 'Hallo,\n\nich interessiere mich für folgende Kunstwerke:\n- ',

          mailSubjectGeneric: 'Anfrage über die Website',

          collections: {'Weihnachten':'Weihnachten','Edition E':'Edition E','Variant':'Variante','General':'Allgemein'}
        }
      };
      function t(key){ return translations[currentLang][key]; }
      // colorName/collection are stored internally in English (used as stable
      // sort keys); translate only for display
      function tColor(name){ return translations[currentLang].colors[name] || name; }
      function tCollection(name){ return translations[currentLang].collections[name] || name; }
      // artwork titles are derived from (German) folder names and stored as
      // the canonical/internal title on each item; translate only for
      // display when in English. Titles left out of this map (e.g. the
      // already-English "Springtime", or "Aus∕fbruch" — a stylized title
      // without a clean literal translation) are shown unchanged.
      const TITLE_TRANSLATIONS_EN = {
        'Frühlingswogen': 'Spring Waves',
        'bewegtes Rot': 'Moving Red',

        'verwobene Erinnerung': 'Interwoven Memory',

        'Herbstspuren im Sonnenlicht': 'Autumn Traces in Sunlight',

        'Farbenfrohes Blättermeer': 'Colorful Sea of Leaves',
        'Muster des Waldes': 'Patterns of the Forest',
        'Farbtanz im Wind': 'Color Dance in the Wind',
        'Blättertanz im Sonnenlicht': 'Leaf Dance in Sunlight',
        'abstraktes Orange': 'Abstract Orange',
        'goldener Weihnachtsduft': 'Golden Christmas Scent',
        'weihnachtliches Baumgeflüster': 'Christmas Tree Whispers',
        'tanzende Weihnachtsbäume': 'Dancing Christmas Trees',
        'Weihnachtsbaumblätter': 'Christmas Tree Leaves',
        'Tannenreigen': 'Fir Tree Dance',
        'Weihnachtsgedanken': 'Christmas Thoughts',
        'rote Weihnacht 1': 'Red Christmas 1',
        'weihnachtliches Schneegestöber': 'Christmas Snow Flurry',
        'Sommer am See': 'Summer at the Lake',
        'rote Weihnacht 2': 'Red Christmas 2',
        'Weihnachtsreigen': 'Christmas Round Dance',
        'Weihnacht blau silber': 'Christmas Blue Silver',
        'Rosenblätter': 'Rose Petals',
        'Rotes Labyrinth': 'Red Labyrinth',
        'Strandgeister': 'Beach Spirits',
        'Sandgewusel': 'Sand Bustle',
        'Verästelung': 'Branching',
        'Zellteilung': 'Cell Division',
        'Sommerwirbel': 'Summer Whirl',

      function tTitle(title){

      const grid = document.getElementById('grid');
      let topRow = document.getElementById('top-row');
      // keep a persistent reference to the original controls element so we can safely move it
      const originalControls = document.querySelector('.controls');
      // same for the logo — render() used to recreate this <img> from
      // scratch on every sort/like/language change, forcing the browser to
      // re-decode and repaint it each time, which caused a visible flash
      // (most noticeable right after a cold page load)
      const persistentLogoWrap = document.createElement('div');
      persistentLogoWrap.className = 'logo-item';
      const persistentLogoImg = document.createElement('img');
      persistentLogoImg.src = 'Icon.svg';
      persistentLogoImg.alt = 'Cosaha';
      persistentLogoImg.className = 'logo-icon';
      persistentLogoWrap.appendChild(persistentLogoImg);
      const modal = document.getElementById('modal');
      const modalContent = document.getElementById('modal-content');
      const modalPrev = document.getElementById('modal-prev');
      const modalNext = document.getElementById('modal-next');
      // modal state for navigating images within the same artwork folder
      // modalFiles: array of image src strings to navigate; modalPos: current index
      let modalFiles = [];
      let modalPos = 0;
      // mapping of folder -> array of image paths (populated from folderImages.json)
      let folderImages = {};
      // load folderImages.json if present to get all images per folder (useful for modal navigation)
      // and to derive the list of main thumbnails shown on the grid.
      fetch('folderImages.json').then(r=>r.json()).then(data=>{
        for(const k in data){
          // normalize the folder key too, so lookups by NFC-normalized item.src succeed
          const nk = (k && k.normalize) ? k.normalize('NFC') : k;
          try{
            // decode and normalize to NFC so URL bytes match deployed filenames
            folderImages[nk] = data[k].map(p=>decodeURIComponent(p).normalize('NFC'));
          }catch(e){
            folderImages[nk] = data[k].map(p=> (p && p.normalize) ? p.normalize('NFC') : p);
          }
        }
        // derive one main thumbnail per folder (prefer files containing '_main' or 'main.jpg')
        const pickMain = (arr)=>{
          if(!arr || !arr.length) return null;
          const lower = arr.map(a=>a.toLowerCase());
          for(let i=0;i<lower.length;i++){
            if(lower[i].includes('_main') || lower[i].endsWith('/main.jpg') || lower[i].endsWith('main.jpg')) return arr[i];
          }
          return arr[0];
        };
        // sort by the folder's leading number numerically, not as a plain
        // string — "10-..." otherwise sorts right after "1-...", ahead of
        // "2-..." through "9-...", scrambling the intended artwork order
        const folderSortKey = (k) => {
          const m = k.match(/^Art\/(\d+)/);
          return m ? parseInt(m[1], 10) : Infinity; // non-numeric folders (e.g. Frame) sort last
        };
        const mains = Object.keys(folderImages).sort((a,b)=>{
          const na = folderSortKey(a), nb = folderSortKey(b);
          return na !== nb ? na - nb : a.localeCompare(b);
        }).map(folder=> pickMain(folderImages[folder])).filter(Boolean);
        if(mains.length){
          artworkSources = mains.slice();
          buildItems();
          render();
        }
      }).catch(()=>{ /* ignore if not present */ });

      // null = automatic (CSS breakpoints decide column count); 1/2/4 =
      // visitor has manually picked a "zoom" level via the mobile top bar
      let mobileColumnOverride = null;

      // matches the .grid/.selected-row single-column breakpoint — used
      // instead of reading computed grid-template-columns so it still
      // works for elements that are currently display:none (selected-row).
      // A manual zoom override always wins: forcing 2 or 4 columns turns
      // off the single-column inline swipe/arrows (tiles are small again,
      // so opening the lightbox is useful again), and forcing 1 turns it
      // on even above the automatic breakpoint.
      function isSingleColumnViewport(){
        if(mobileColumnOverride != null) return mobileColumnOverride === 1;
        return window.matchMedia('(max-width: 32.5rem)').matches;
      }

      // resolves every image in an item's artwork folder (for modal
      // prev/next and the single-column inline swipe/arrows), and which
      // position within that list the item's own src is at
      function resolveFolderFiles(item){
        const src = item.src;
        const folder = src.substring(0, src.lastIndexOf('/')) + '/';
        const normSrc = (src && src.normalize) ? src.normalize('NFC') : src;
        if(folderImages[folder] && folderImages[folder].length){
          const files = folderImages[folder].slice().map(s => (s && s.normalize) ? s.normalize('NFC') : s);
          let pos = files.indexOf(normSrc);
          if(pos === -1){
            // try matching by decode/encode variants
            const decodedFiles = files.map(p=>{ try { return decodeURIComponent(p).normalize('NFC'); } catch(e){ return p; } });
            pos = decodedFiles.indexOf(normSrc);
            if(pos === -1) pos = 0;
          }
          return { files, pos };
        }
        // fallback: build group from items in same folder
        const group = items.map(it=>it.src).filter(s => s && s.startsWith(folder)).map(s => (s && s.normalize) ? s.normalize('NFC') : s);
        const files = group.length ? group : [normSrc];
        let pos = files.indexOf(normSrc);
        if(pos === -1) pos = 0;
        return { files, pos };
      }

      function openModalFor(idx){
        const { files, pos } = resolveFolderFiles(items[idx]);
        modalFiles = files;
        showModalAt(pos);
      }

      function showModalAt(pos){
        const src = modalFiles[pos];
        const item = items.find(it=>it.src === src);
        modal.classList.add('open');
        modalContent.innerHTML = '';
        const large = document.createElement('img');
        const largeSrc = (src && src.normalize) ? src.normalize('NFC') : src;
        large.src = encodeURI(largeSrc);
        large.alt = item ? tTitle(item.title) : titleFromPath(src);
        large.draggable = false;
        large.addEventListener('contextmenu', (e)=>e.preventDefault());
        // double tap/double click the enlarged image toggles selection,
        // same as pushing the heart button on the thumbnail — the modal can
        // be showing any photo in the artwork's folder (via prev/next), not
        // just its main thumbnail, so resolve the item by folder rather than
        // by exact src match
        large.addEventListener('dblclick', (e)=>{
          e.preventDefault();
          const folder = largeSrc.substring(0, largeSrc.lastIndexOf('/')) + '/';
          const folderItem = item || items.find(it=>it.src.startsWith(folder));
          if(folderItem) toggleSelect(folderItem);
        });
        modalContent.appendChild(large);
        modal.setAttribute('aria-hidden','false');
        cap.textContent = item ? tTitle(item.title) : titleFromPath(src);
        cap.style.display = 'block';

        const hasMultiple = modalFiles.length > 1;
        modalPrev.style.display = hasMultiple ? '' : 'none';
        modalNext.style.display = hasMultiple ? '' : 'none';
      }

      function modalPrevClick(){
        if(modalFiles.length <= 1) return;
        modalPos = (modalPos - 1 + modalFiles.length) % modalFiles.length;
        showModalAt(modalPos);
      }
      function modalNextClick(){
        if(modalFiles.length <= 1) return;
        modalPos = (modalPos + 1) % modalFiles.length;
        showModalAt(modalPos);
      }
      const cap = document.getElementById('cap');
      const sortSelect = document.getElementById('sort-select');

      // build a custom-styled select UI to replace native dropdown visuals (so hover/focus use our accent)
      const OPTION_LABEL_KEYS = {
        newest: 'sortNewest', color: 'sortColor', title: 'sortTitle',
        spring: 'filterSpring', summer: 'filterSummer', autumn: 'filterAutumn', winter: 'filterWinter', christmas: 'filterChristmas'
      };

      function optionLabel(value){
        return t(OPTION_LABEL_KEYS[value] || value);
      }

      // custom-styled dropdown(s) built by createCustomSelect (currently just sort)
      const customSelects = [];

      // multi-select: an artwork matching ANY active filter is shown;
      // empty set = no filter = show everything
      const activeFilters = new Set();

      // re-applies current-language text to the sort/filter labels, the
      // custom select's button/list items, the filter buttons, and the
      // modal nav aria-labels
      function updateSortLabels(){
        const sortLabelEl = document.querySelector('label[for="sort-select"]');
        if(sortLabelEl) sortLabelEl.textContent = t('sortBy');
        const filterLabelEl = document.getElementById('filter-label');
        if(filterLabelEl) filterLabelEl.textContent = t('filterBy');
        document.querySelectorAll('.filter-btn').forEach(btn=>{
          btn.textContent = optionLabel(btn.dataset.filter);
        });
        customSelects.forEach(({ sel, button, list })=>{
          Array.from(list.children).forEach(it=>{ it.textContent = optionLabel(it.dataset.value); });
          button.textContent = optionLabel(sel.value);
        });
        modalPrev.setAttribute('aria-label', t('prevAria'));
        modalNext.setAttribute('aria-label', t('nextAria'));
        document.getElementById('scroll-top-btn').setAttribute('aria-label', t('scrollTopAria'));
      }

      function createCustomSelect(sel, insertBeforeEl){
        const container = sel.parentElement;
        if(!container) return;
        // keep native select in memory but remove it from DOM (we'll drive it from JS)
        sel.style.position = 'absolute'; sel.style.left = '-9999px'; sel.style.top = 'auto';

        const wrapper = document.createElement('div'); wrapper.className = 'custom-select';
        const button = document.createElement('button'); button.type = 'button'; button.className = 'custom-select-button';
        button.textContent = optionLabel(sel.value);
        const list = document.createElement('div'); list.className = 'custom-select-list'; list.style.display = 'none';

        Array.from(sel.options).forEach(opt=>{
          const it = document.createElement('div'); it.className = 'custom-select-item'; it.textContent = optionLabel(opt.value); it.dataset.value = opt.value;
          it.addEventListener('click', ()=>{
            sel.value = it.dataset.value;
            button.textContent = it.textContent;
            list.style.display = 'none';
            sel.dispatchEvent(new Event('change'));
          });
          list.appendChild(it);
        });

        button.addEventListener('click', (e)=>{ e.stopPropagation(); list.style.display = list.style.display === 'none' ? 'block' : 'none'; });
        document.addEventListener('click', ()=>{ list.style.display = 'none'; });
        wrapper.appendChild(button); wrapper.appendChild(list);
        container.insertBefore(wrapper, insertBeforeEl);
        // remove the original select element from the DOM so only the custom control is visible
        if(sel.parentNode === container) container.removeChild(sel);
        customSelects.push({ sel, button, list });
      }

      // pinch gesture also switches between the same 1/2/4 zoom steps as
      // the zoom-switch buttons — one step per pinch (not continuous), so
      // a single gesture can't jump straight from 1 to 4
      const ZOOM_STEPS = [1, 2, 4];
      function currentZoomStep(){
        if(mobileColumnOverride != null) return mobileColumnOverride;
        const cols = window.getComputedStyle(grid).gridTemplateColumns.split(' ').length || 4;
        if(cols <= 1) return 1;
        if(cols <= 2) return 2;
        return 4;
      }
      function touchDist(touches){
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
      }
      let pinchStartDist = null;
      let pinchStepped = false;
      document.addEventListener('touchstart', (e)=>{
        if(e.touches.length === 2){
          pinchStartDist = touchDist(e.touches);
          pinchStepped = false;
        }
      }, { passive: true });
      document.addEventListener('touchmove', (e)=>{
        if(e.touches.length !== 2) return;
        // block the browser's native pinch-zoom so it doesn't fight with
        // (or pre-empt) our own step-based column switching below —
        // requires a non-passive listener to be allowed to call this
        e.preventDefault();
        if(pinchStartDist == null || pinchStepped) return;
        const delta = touchDist(e.touches) - pinchStartDist;
        const PINCH_THRESHOLD = 40; // px of spread/pinch before switching a step
        if(Math.abs(delta) < PINCH_THRESHOLD) return;
        const stepIdx = ZOOM_STEPS.indexOf(currentZoomStep());
        const dir = delta > 0 ? -1 : 1; // spreading apart = fewer, bigger columns; pinching in = more, smaller
        const nextStep = ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length - 1, stepIdx + dir))];
        if(nextStep !== currentZoomStep()) setColumnOverride(nextStep);
        pinchStepped = true;
      }, { passive: false });

        if(e.touches.length < 2){ pinchStartDist = null; pinchStepped = false; }
      });

      // folder names carry a "-<farbe>" suffix (see
      // scripts/add_color_to_folder_names.py) for organization, but it
      // shouldn't show up in the displayed title — only strip it when
      // hyphen-joined (how that script always appends it); a handful of
      // folders have a color word as a natural, space-joined part of their
      // real title (e.g. "2-bewegtes Rot") and are deliberately left alone
      const FOLDER_COLOR_SUFFIXES = ['rot','orange','gelb','limette','grün','petrol','cyan','blau','indigo','violett','magenta','karmesinrot'];
      const FOLDER_COLOR_SUFFIX_RE = new RegExp('-(' + FOLDER_COLOR_SUFFIXES.join('|') + ')$', 'i');

      function titleFromPath(p){
        const part = p.split('/')[1]||p;
        return part
          .replace(FOLDER_COLOR_SUFFIX_RE, '')
          .replace(/^\d+[-_]?/, '')
          .replace(/[-_]+/g, ' ')
          .replace(/\s+e\s+/, ' ')
          .trim();
      }

      // Optional manual metadata overrides by image path
      // Example: {'Art/33-Sommer am See/33_main.jpg': { season: 'Summer', collection: 'Lakes' }}
      const metadataOverrides = {
        'Art/33-Tannenreigen-grün/29_main.jpg': { collection: 'Weihnachten' }
      };

      function inferSeason(title){
        const t = title.toLowerCase();
        if(/weihnacht|winter|schnee|schneeg/.test(t)) return 'Winter';
        if(/frühling|fruehling|fruhling|fruehlings|frühlings/.test(t)) return 'Spring';
        if(/sommer|sonne/.test(t)) return 'Summer';
        if(/herbst/.test(t)) return 'Autumn';
        return 'Unknown';
      }

      function inferCollection(title, src){
        const t = title.toLowerCase();
        if(/weihnacht/.test(t)) return 'Weihnachten';
        if(/-e-|_e_| e /.test(' ' + src + ' ')) return 'Edition E';
        if(/-v\b|_v\b/.test(src)) return 'Variant';
        return 'General';
      }

      // one color per artwork, decided by the artist via the folder name's
      // "-<farbe>" suffix (see scripts/add_color_to_folder_names.py) —
      // no pixel sampling. Order here also decides "sort by color" bucketing.
      const COLOR_NAMES = ['red','orange','yellow','lime','green','teal','cyan','blue','indigo','violet','magenta','crimson'];
      const DE_TO_EN_COLOR = {
        rot:'red', orange:'orange', gelb:'yellow', limette:'lime', grün:'green',
        petrol:'teal', cyan:'cyan', blau:'blue', indigo:'indigo', violett:'violet',
        magenta:'magenta', karmesinrot:'crimson'
      };
      // matches the trailing color word whether hyphen-joined (appended by
      // the script) or space-joined (a handful of folders have it as a
      // natural part of their real title, e.g. "2-bewegtes Rot") — for
      // *this* purpose (deciding the one color) both count
      const FOLDER_COLOR_WORD_RE = new RegExp('[-_ ](' + Object.keys(DE_TO_EN_COLOR).join('|') + ')$', 'i');

      function colorKeyFromPath(p){
        const folderName = p.split('/')[1] || '';
        const m = folderName.match(FOLDER_COLOR_WORD_RE);
        return m ? DE_TO_EN_COLOR[m[1].toLowerCase()] : 'unknown';

        // build persistent bottom-row with contact tiles

        const selected = new Set();

        function setSelected(item, isSelected){

          renderSelectionBar();

          // some browsers apply a focus-loss scroll adjustment a frame later;
          // reapply once more after layout settles to be safe
          requestAnimationFrame(()=>window.scrollTo(scrollX, scrollY));

        // reuses cellFor() so each tile is styled identically to the main
        // gallery (same border, same heart toggle, same click-to-enlarge)
        function renderSelectedRow(){

        // fixed bar at the bottom of the screen listing selected artwork
        // titles, so they're visible while scrolling the gallery — always
        // shown, even with nothing selected yet
        function renderSelectionBar(){
          const bar = document.getElementById('selection-bar');

          document.documentElement.style.setProperty('--selection-bar-height', barHeight);

        function renderBottomRow(){

          // Contact info tile
          const contactInfo = document.createElement('div');
          contactInfo.className = 'cell-like';

          ci.style.textAlign = 'center';

        // Impressum tile — opens modal with official Impressum text
        const imp = document.createElement('div');
        imp.className = 'cell-like';
        imp.style.textAlign = 'center';
        imp.innerHTML = '<strong>' + t('impressum') + '</strong>';
        imp.addEventListener('click', ()=>{
          modal.classList.add('open');

          modalPrev.style.display = 'none';
          modalNext.style.display = 'none';
          const wrapper = document.createElement('div');
          wrapper.style.maxWidth = '92vw';
          wrapper.style.maxHeight = '88vh';
          wrapper.style.overflow = 'auto';
          wrapper.style.background = '#fff';
          wrapper.style.padding = '1rem';
          wrapper.innerHTML = `
            <h2>Impressum</h2>
            <p>Angaben gemäß § 5 DDG:</p>
            <p>
              Cordula Saupe-Hartstang<br>
              Schneeballweg 6<br>
              71139 Ehningen<br>
              Deutschland

      // photos are named with an embedded capture timestamp (YYYYMMDD_HHMMSS,
      // e.g. "37_20260220_103421_Rosenblätter.jpg"); use the earliest one found
      // among an artwork's files as its creation date for "Newest" sorting.
      function extractDateKey(paths){
        const re = /(\d{8})_(\d{6})/;
        let best = null;
        for(const p of (paths || [])){
          const m = re.exec(p);
          if(m){
            const key = m[1] + m[2];
            if(best === null || key < best) best = key;
          }
        }
        return best;
      }

      function buildItems(){
        items = artworkSources.map((src, idx) => {
          const s = (src && src.normalize) ? src.normalize('NFC') : src;
          const title = titleFromPath(s);
          const override = metadataOverrides[s] || {};
          const season = override.season || inferSeason(title);
          const collection = override.collection || inferCollection(title, s);
          const seasons = SEASON_TAGS[title] || [];
          const folder = s.substring(0, s.lastIndexOf('/')) + '/';
          const dateKey = extractDateKey(folderImages[folder] || [s]);
          const colorName = colorKeyFromPath(s);
          return {
            idx,
            src: s,
            title,
            season,
            collection,
            seasons,
            colorName,
            dateKey
          };
        });
      }

      // build initial items from fallback list; this will be replaced if folderImages.json is present
      buildItems();

      // singleCol: in the one-column mobile layout, the enlarged lightbox
      // adds little (the thumbnail is already nearly full width), so
      // instead of opening it, show prev/next arrows on the thumbnail
      // itself and let it be swiped between an artwork's photos in place
      function cellFor(item, singleCol){
        const a = document.createElement('a');
        a.href = 'javascript:void(0)';
        a.className = 'cell';
        const img = document.createElement('img');
        const imgSrc = (item.src && item.src.normalize) ? item.src.normalize('NFC') : item.src;
        img.src = encodeURI(imgSrc);
        img.alt = tTitle(item.title);
        img.loading = 'lazy';
        img.draggable = false;
        img.addEventListener('contextmenu', (e)=>e.preventDefault());
        a.appendChild(img);

        if(singleCol){
          const { files, pos: startPos } = resolveFolderFiles(item);
          if(files.length > 1){
            let pos = startPos;
            const showAt = (p) => {
              pos = ((p % files.length) + files.length) % files.length;
              const s = (files[pos] && files[pos].normalize) ? files[pos].normalize('NFC') : files[pos];
              img.src = encodeURI(s);
            };
            const prevBtn = document.createElement('button');
            prevBtn.type = 'button'; prevBtn.className = 'cell-nav cell-nav-prev'; prevBtn.textContent = '◀';
            prevBtn.setAttribute('aria-label', t('prevAria'));
            prevBtn.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); showAt(pos - 1); });
            prevBtn.addEventListener('dblclick', (e)=>e.stopPropagation());
            const nextBtn = document.createElement('button');
            nextBtn.type = 'button'; nextBtn.className = 'cell-nav cell-nav-next'; nextBtn.textContent = '▶';
            nextBtn.setAttribute('aria-label', t('nextAria'));
            nextBtn.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); showAt(pos + 1); });
            nextBtn.addEventListener('dblclick', (e)=>e.stopPropagation());
            a.appendChild(prevBtn);
            a.appendChild(nextBtn);

            let touchStartX = null;
            a.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; }, { passive: true });
            a.addEventListener('touchend', (e)=>{
              if(touchStartX == null) return;
              const dx = e.changedTouches[0].clientX - touchStartX;
              touchStartX = null;
              if(Math.abs(dx) < 30) return; // ignore small taps/jitter
              if(dx < 0) showAt(pos + 1); else showAt(pos - 1);
            }, { passive: true });
          }
          // no click-to-enlarge in single-column mode — see comment above;
          // double-tap likes the artwork instead, mirroring the lightbox
          a.addEventListener('dblclick', (e)=>{
            e.preventDefault();
            toggleSelect(item);
          });
        } else {
          a.addEventListener('click', ()=>{
            openModalFor(item.idx);
          });
        }

        const isSelected = selected.has(item.src);
        const selectBtn = document.createElement('button');
        selectBtn.type = 'button';
        selectBtn.className = 'select-btn' + (isSelected ? ' selected' : '');
        // classic rounded heart — a fixed shape; only its color/background
        // changes on selection, via the .selected class and the SVG's
        // fill="currentColor"
        selectBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

      // splits text on explicit '\n' paragraph breaks (not every sentence)
      // and inserts a blank line (double <br>) only at those points —
      // shared by the headline welcome blurb and the philosophy cell's
      // details text
      function appendParagraphs(container, text){
        const paragraphs = text.split('\n');
        paragraphs.forEach((p, i) => {
          const txt = p.trim();
          if (!txt) return;
          container.appendChild(document.createTextNode(txt));
          if (i < paragraphs.length - 1) {
            container.appendChild(document.createElement('br'));
            container.appendChild(document.createElement('br'));
          }
        });
      }

      function render(){
        const mode = sortSelect.value;
        // filter by season/category (an artwork can belong to several at
        // once, per Kategorien.xlsx); multi-select — an item matching ANY
        // active filter is shown; no active filters = show everything
        let list = activeFilters.size === 0
          ? items.slice()
          : items.filter(it => (it.seasons || []).some(s => activeFilters.has(s)));
        list.sort((a,b)=>{
          switch(mode){
            case 'newest': {
              const ak = a.dateKey || '';
              const bk = b.dateKey || '';
              if(ak !== bk) return ak < bk ? 1 : -1;
              return b.idx - a.idx;
            }
            case 'title':
              return a.title.localeCompare(b.title, undefined, {sensitivity:'base'});
            case 'color': {
              // one color per artwork (from the folder name), grouped in
              // COLOR_NAMES order; tiebreak by title within the same color
              const af = COLOR_NAMES.indexOf(a.colorName); const bf = COLOR_NAMES.indexOf(b.colorName);
              const abucket = af === -1 ? COLOR_NAMES.length : af;
              const bbucket = bf === -1 ? COLOR_NAMES.length : bf;
              if (abucket !== bbucket) return abucket - bbucket;
              return a.title.localeCompare(b.title, undefined, {sensitivity:'base'});
            }
            default:
              return a.idx - b.idx; // original order
          }
        });
        // ensure topRow exists
        if(!topRow){
          topRow = document.createElement('div');
          topRow.id = 'top-row';
          topRow.className = 'top-row';
          grid.before(topRow);
        }
        // clear and rebuild topRow each render; we'll re-append the stored controls node
        topRow.innerHTML = '';

        // move the persistent logo node in rather than recreating it —
        // see persistentLogoWrap comment for why
        topRow.appendChild(persistentLogoWrap);

        // insert headline as its own top-row cell, with the welcome blurb
        // stacked below it
        const headWrap = document.createElement('div');
        headWrap.className = 'headline-item';
        const h = document.createElement('h1');
        // headline may contain a '\n' marking an explicit line break
        const headlineParts = t('headline').split('\n');
        headlineParts.forEach((part, i) => {
          h.appendChild(document.createTextNode(part));
          if (i < headlineParts.length - 1) h.appendChild(document.createElement('br'));
        });
        headWrap.appendChild(h);
        const welcomeP = document.createElement('p'); welcomeP.className = 'phi';
        appendParagraphs(welcomeP, t('introWelcome'));
        headWrap.appendChild(welcomeP);
        topRow.appendChild(headWrap);

        // insert single philosophy cell (one top-row tile)
        const phWrap = document.createElement('div');
        phWrap.className = 'philosophy-item';
        const php = document.createElement('p'); php.className = 'phi';
        appendParagraphs(php, t('introDetails'));
        phWrap.appendChild(php);
        topRow.appendChild(phWrap);

        // insert controls as a top-row tile by moving the original controls element into it (placed last in the first row)
        if(originalControls){
          const controlsTile = document.createElement('div');
          controlsTile.className = 'controls-item';
          controlsTile.appendChild(originalControls);
          topRow.appendChild(controlsTile);
        }

        // clear grid artworks area
        grid.innerHTML = '';

        // render rows with two artworks and their text tiles per row
        const pairs = list.slice();
        // determine current number of columns from computed style
        const computedCols = window.getComputedStyle(grid).gridTemplateColumns.split(' ').length || 4;
        // prefer two artworks per row; fall back to 1 if columns are too small
        let pairsPerRow = 2;
        if (computedCols < 2) pairsPerRow = 1;
        const preCount = grid.children.length;
        let idx = 0;
        let rowIndex = Math.floor(preCount / computedCols);
        // single-column view: always artwork-then-text, top-left aligned,
        // instead of the normal alternating side-left/side-right layout
        const singleCol = isSingleColumnViewport();
        while (idx < pairs.length) {
          const rowSlice = pairs.slice(idx, idx + pairsPerRow);
          // start rows with the text cell (offset parity so text appears first)
          const artworkFirst = singleCol ? true : (rowIndex % 2 !== 0);
          for (const art of rowSlice) {
            const artCell = cellFor(art, singleCol);
            const titleCell = document.createElement('div');
            titleCell.className = 'text-item';
            const titleDiv = document.createElement('div'); titleDiv.className = 'title'; titleDiv.textContent = tTitle(art.title);
            const metaDiv = document.createElement('div'); metaDiv.className = 'meta';
            const metaParts = [];
            if (art.colorName) metaParts.push(tColor(art.colorName));
            if (art.collection) metaParts.push(tCollection(art.collection));
            metaDiv.textContent = metaParts.join(' · ');
            const tp = document.createElement('div'); tp.className = 'phi'; tp.appendChild(titleDiv); tp.appendChild(metaDiv);
            titleCell.appendChild(tp);
            art._metaDiv = metaDiv;

            if (singleCol) {
              grid.appendChild(artCell);
              titleCell.classList.add('single-col');
              grid.appendChild(titleCell);
            } else if (artworkFirst) {
              grid.appendChild(artCell);
              titleCell.classList.add('side-right');
              grid.appendChild(titleCell);
            } else {
              titleCell.classList.add('side-left');
              grid.appendChild(titleCell);
              grid.appendChild(artCell);
            }
          }
          idx += pairsPerRow;
          rowIndex += 1;
        }
      }

      let renderTimer = null;
      function debouncedRender(){
        if(renderTimer) cancelAnimationFrame(renderTimer);
        renderTimer = requestAnimationFrame(render);
      }

      sortSelect.addEventListener('change', render);

      // the mobile top bar is fixed and always-on-top (like the selection
      // bar), so the lightbox needs matching top padding or the enlarged
      // image would render underneath it; offsetHeight is naturally 0 when
      // the bar's media query makes it display:none, so this needs no
      // separate "are we on mobile" check of its own
      function updateMobileTopBarSpacing(){
        const bar = document.getElementById('mobile-top-bar');
        const h = bar.offsetHeight + 'px';
        modal.style.paddingTop = h;
        document.body.style.paddingTop = h;
      }

      // re-render on resize/rotation so crossing the single-column
      // breakpoint switches between the lightbox and inline swipe/arrows
      let resizeTimer = null;
      let lastSingleCol = isSingleColumnViewport();
      window.addEventListener('resize', ()=>{
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(()=>{
          updateMobileTopBarSpacing();
          const nowSingleCol = isSingleColumnViewport();
          if(nowSingleCol !== lastSingleCol){
            lastSingleCol = nowSingleCol;
            render();
            renderSelectedRow();
          }
        }, 150);
      });

      // Initial render
      updateSortLabels();
      render();
      renderBottomRow();
      renderSelectedRow();
      renderSelectionBar();
      updateMobileTopBarSpacing();

      modal.addEventListener('click', (e)=>{
        // close only when clicking the backdrop, not when clicking modal content or nav buttons
        if(e.target === modal){
          modal.classList.remove('open');
          modal.setAttribute('aria-hidden','true');
          modalContent.innerHTML = '';
          cap.style.display = 'none';
        }
      });
      modalPrev.addEventListener('click', (e)=>{ e.stopPropagation(); modalPrevClick(); });
      modalNext.addEventListener('click', (e)=>{ e.stopPropagation(); modalNextClick(); });
      document.addEventListener('keydown', (e)=>{
        if(e.key==='Escape'){
          modal.classList.remove('open');
        } else if(e.key==='ArrowLeft'){
          if(modal.classList.contains('open')) modalPrevClick();
        } else if(e.key==='ArrowRight'){
          if(modal.classList.contains('open')) modalNextClick();
        }
      });

      document.addEventListener('keydown', (e)=>{
        if(e.key==='Escape') modal.classList.remove('open');
      });
